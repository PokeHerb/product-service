spring:
  application:
    name: product-service
  config:
    import: 'optional:configserver: '
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

springdoc:
  swagger-ui:
    path: /swagger-ui.html   # Swagger UI 접속 URL
  api-docs:
    path: /v3/api-docs       # OpenAPI JSON URL

eureka:
  instance:
    prefer-ip-address: false
    hostname: 35.216.57.113

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://35.216.57.113:3150/eureka/